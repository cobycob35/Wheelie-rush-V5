<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wheelie Rush Recovery V6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:white;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:58vh;background:linear-gradient(#63b7ff,#d8f2ff)}
#ui{height:42vh;background:#151b24;padding:8px;overflow:auto}select,button,input{font:700 15px system-ui}select{width:100%;padding:9px;border-radius:8px}
.row{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}button{padding:10px 13px;border:0;border-radius:9px;background:#e7edf4}button:active{transform:scale(.96)}
#start{background:#69e675}#gas{width:min(520px,100%);flex:1}.box{background:#0008;border-radius:8px;padding:6px 9px}
#status{font-weight:900;color:#9dff8b}.tiny{font-size:12px;opacity:.8}
</style></head>
<body><canvas id="game"></canvas><div id="ui">
<select id="bike"></select>
<div class="row"><button id="start">🔑 START</button><button id="down">− GEAR</button><button id="up">+ GEAR</button><button id="brake">BRAKE</button><span id="gear" class="box">N</span></div>
<div class="row"><b>THROTTLE</b><input id="gas" type="range" min="0" max="100" value="0"><b id="pct">0%</b></div>
<div id="status" class="box">ENGINE OFF • N • 0.0 MPH</div>
<div class="tiny">RECOVERY V6: V5 checkpoint + connected crash ragdoll.</div>
</div>
<script>
const C=document.querySelector('#game'),g=C.getContext('2d'),S=document.querySelector('#bike'),gas=document.querySelector('#gas');
const bikes=[
 {name:'60cc Mini',cc:60,max:48,color:'#ffca28'},{name:'85cc Mini MX',cc:85,max:62,color:'#ff7043'},
 {name:'110cc Pit Bike',cc:110,max:68,color:'#42a5f5'},{name:'125cc Two-Stroke',cc:125,max:78,color:'#66bb6a'},
 {name:'150cc MX',cc:150,max:82,color:'#ab47bc'},{name:'250cc Race Bike',cc:250,max:94,color:'#ef5350'},
 {name:'450cc Factory MX',cc:450,max:108,color:'#26c6da'},{name:'500cc Two-Stroke Custom',cc:500,max:116,color:'#ffa726'}
];
bikes.forEach((b,i)=>S.add(new Option(`[${b.cc}cc] ${b.name}`,i)));
let running=false,gear=0,speed=0,rpm=0,last=performance.now(),scroll=0,audio=null,lastSel=0;
let brakeHeld=false,suspF=0,suspR=0,suspFV=0,suspRV=0,chassisPitch=0;
let wheelieAngle=0,wheelieVel=0,crashed=false;
let crashTime=0,crashSpeed=0,bikeCrashX=0,bikeCrashY=0,bikeCrashRot=0,bikeCrashVX=0,bikeCrashVY=0,bikeCrashVR=0;
let doll=null;

function resize(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*.58*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function bike(){return bikes[Number(S.value)||0]}
function syncSelection(){let n=Number(S.value)||0;if(n!==lastSel){lastSel=n;running=false;gear=0;speed=0;rpm=0;gas.value=0;suspF=suspR=suspFV=suspRV=chassisPitch=0;wheelieAngle=wheelieVel=0;crashed=false;crashTime=0;doll=null;
 bikeCrashX=bikeCrashY=bikeCrashRot=bikeCrashVX=bikeCrashVY=bikeCrashVR=0;stopSound();update()}}
S.oninput=syncSelection;S.onchange=syncSelection;

function audioOn(){
 if(!audio){
   let a=new (window.AudioContext||window.webkitAudioContext)();
   let master=a.createGain(),low=a.createOscillator(),high=a.createOscillator(),sub=a.createOscillator();
   let lowGain=a.createGain(),highGain=a.createGain(),subGain=a.createGain(),filter=a.createBiquadFilter(),comp=a.createDynamicsCompressor();
   low.type='sawtooth';high.type='square';sub.type='triangle';
   low.connect(lowGain);high.connect(highGain);sub.connect(subGain);
   lowGain.connect(filter);highGain.connect(filter);subGain.connect(filter);
   filter.connect(comp);comp.connect(master);master.connect(a.destination);
   master.gain.value=0;lowGain.gain.value=.5;highGain.gain.value=.18;subGain.gain.value=.12;
   comp.threshold.value=-20;comp.ratio.value=4;
   low.start();high.start();sub.start();
   audio={a,master,low,high,sub,lowGain,highGain,subGain,filter};
 }
 audio.a.resume();
}
function stopSound(){if(audio)audio.master.gain.setTargetAtTime(0,audio.a.currentTime,.025)}
function sound(){
 if(!audio)return;
 let b=bike(),cc=b.cc,t=audio.a.currentTime,p=Number(gas.value)/100;
 let idle,red,pulses,harm,cut,subMix,hiMix;
 if(cc<=60){idle=2600;red=13200;pulses=.50;harm=3.05;cut=6200;subMix=.025;hiMix=.26}
 else if(cc<=85){idle=2350;red=12800;pulses=.50;harm=3.01;cut=5900;subMix=.035;hiMix=.25}
 else if(cc<=110){idle=2050;red=11800;pulses=.50;harm=2.98;cut=5400;subMix=.045;hiMix=.23}
 else if(cc<=125){idle=1900;red=11600;pulses=.50;harm=3.03;cut=5600;subMix=.05;hiMix=.25}
 else if(cc<=150){idle=1800;red=10800;pulses=.50;harm=2.96;cut=5000;subMix=.06;hiMix=.21}
 else if(cc<=250){idle=1650;red=10200;pulses=.50;harm=2.48;cut=4300;subMix=.085;hiMix=.18}
 else if(cc<=450){idle=1450;red=9400;pulses=.50;harm=2.02;cut=3200;subMix=.17;hiMix=.105}
 else {idle=1350;red=8800;pulses=.50;harm=2.62;cut=3900;subMix=.13;hiMix=.17}

 // RPM follows both road speed and throttle, but smoothly.
 let gearCap=[1,.26,.43,.60,.75,.89,1][gear||1];
 let roadLoad=Math.min(1,speed/Math.max(1,b.max*gearCap));
 let desired=running?idle+(red-idle)*Math.min(1,roadLoad*.66+p*.40):0;
 rpm += (desired-rpm)*.12;

 // Single-cylinder pulse foundation. Two-strokes use brighter upper harmonics;
 // the 450 gets much more low/sub energy for the four-stroke thump.
 let fireHz=Math.max(18,(rpm/60)*pulses);
 audio.low.frequency.setTargetAtTime(fireHz,t,.018);
 audio.high.frequency.setTargetAtTime(fireHz*harm,t,.018);
 audio.sub.frequency.setTargetAtTime(Math.max(20,fireHz*.50),t,.025);
 audio.lowGain.gain.setTargetAtTime(cc>=450?.56:.42,t,.03);
 audio.highGain.gain.setTargetAtTime(hiMix*(.65+p*.35),t,.03);
 audio.subGain.gain.setTargetAtTime(subMix*(.75+p*.25),t,.04);
 audio.filter.type='lowpass';
 audio.filter.frequency.setTargetAtTime(cut+(p*900),t,.035);
 audio.filter.Q.setTargetAtTime(cc<=150?1.15:.72,t,.04);
 audio.master.gain.setTargetAtTime(running&&!crashed?.16:0,t,.028);
}
document.querySelector('#start').onclick=()=>{
 audioOn();
 if(crashed){crashed=false;wheelieAngle=wheelieVel=0;speed=0;gear=1;running=true;gas.value=0;
 crashTime=0;doll=null;bikeCrashX=bikeCrashY=bikeCrashRot=bikeCrashVX=bikeCrashVY=bikeCrashVR=0}
 else{running=!running;if(running&&gear===0)gear=1}
 if(!running)stopSound();update()
};
document.querySelector('#up').onclick=()=>{if(running&&!crashed)gear=Math.min(6,Math.max(1,gear+1));update()};
document.querySelector('#down').onclick=()=>{if(crashed)return;gear=Math.max(0,gear-1);update()};
gas.oninput=update;
const brakeBtn=document.querySelector('#brake');
function brakeOn(e){if(e)e.preventDefault();brakeHeld=true}
function brakeOff(e){if(e)e.preventDefault();brakeHeld=false}
brakeBtn.addEventListener('pointerdown',brakeOn);
brakeBtn.addEventListener('pointerup',brakeOff);
brakeBtn.addEventListener('pointercancel',brakeOff);
brakeBtn.addEventListener('pointerleave',brakeOff);

function update(){
 let b=bike(),p=+gas.value;
 document.querySelector('#pct').textContent=p+'%';document.querySelector('#gear').textContent=gear?`G${gear}`:'N';
 document.querySelector('#start').textContent=running?'🛑 STOP':'🔑 START';
 document.querySelector('#status').textContent=crashed
 ?`💥 CRASHED • ${b.cc}cc • Tap START to reset`
 :`ACTIVE ${b.cc}cc • ENGINE ${running?'ON':'OFF'} • G${gear} • GAS ${p}% • ${speed.toFixed(1)} MPH${wheelieAngle>.08?' • WHEELIE '+Math.round(wheelieAngle*57.3)+'°':''}`;
}
function drawBike(b,x,y,sf=0,sr=0,pitch=0){
 let cc=b.cc;
 // Distinct real-world-inspired proportions by displacement.
 let sc=cc<=60?.66:cc<=85?.73:cc<=110?.80:cc<=125?.86:cc<=150?.91:cc<=250?1:cc<=450?1.07:1.12;
 let wb=cc<=60?82:cc<=85?94:cc<=110?104:cc<=125?114:cc<=150?120:cc<=250?130:cc<=450?138:145;
 let wr=cc<=60?17:cc<=85?20:cc<=110?22:cc<=150?24:cc<=250?26:28;
 let rearX=-wb/2,frontX=wb/2,rearY=20+sr,frontY=20+sf;
 g.save();g.translate(x,y);g.rotate(pitch);g.scale(sc,sc);

 // knobby tires, rims, spokes and brake rotors
 for(let X of [rearX,frontX]){
   let Y=X===rearX?rearY:frontY;
   g.fillStyle='#101114';g.beginPath();g.arc(X,Y,wr+3,0,Math.PI*2);g.fill();
   g.strokeStyle='#333';g.lineWidth=3;
   for(let q=0;q<12;q++){let an=q*Math.PI/6;g.beginPath();g.moveTo(X+Math.cos(an)*(wr+1),Y+Math.sin(an)*(wr+1));g.lineTo(X+Math.cos(an)*(wr+5),Y+Math.sin(an)*(wr+5));g.stroke()}
   g.strokeStyle='#bfc5ca';g.lineWidth=3;g.beginPath();g.arc(X,Y,wr-6,0,Math.PI*2);g.stroke();
   g.lineWidth=1;for(let q=0;q<10;q++){let an=q*Math.PI/5;g.beginPath();g.moveTo(X,Y);g.lineTo(X+Math.cos(an)*(wr-7),Y+Math.sin(an)*(wr-7));g.stroke()}
   g.fillStyle='#aeb4ba';g.beginPath();g.arc(X,Y,8,0,Math.PI*2);g.fill();
   if(X===frontX){g.strokeStyle='#d8dde1';g.lineWidth=2;g.beginPath();g.arc(X,Y,12,0,Math.PI*2);g.stroke();g.fillStyle='#555';g.fillRect(X-13,Y-5,5,10)}
 }

 // frame and swingarm
 g.strokeStyle='#aeb5ba';g.lineWidth=6;g.beginPath();g.moveTo(rearX,rearY);g.lineTo(-12,6);g.lineTo(-27,-28);g.lineTo(24,-27);g.lineTo(8,18);g.lineTo(-16,18);g.closePath();g.stroke();
 g.strokeStyle='#8f969b';g.lineWidth=7;g.beginPath();g.moveTo(rearX,rearY);g.lineTo(-9,10);g.stroke();

 // chain and rear sprocket
 g.strokeStyle='#4d4d4d';g.lineWidth=2;g.beginPath();g.arc(rearX,rearY,10,0,Math.PI*2);g.stroke();
 g.beginPath();g.moveTo(rearX+2,rearY-9);g.lineTo(-5,10);g.lineTo(rearX+2,rearY+9);g.stroke();

 // textured inverted fork + guards
 g.strokeStyle='#d6b54a';g.lineWidth=8;g.beginPath();g.moveTo(25,-29);g.lineTo(frontX-2,frontY-5);g.stroke();
 g.strokeStyle='#e5e7e9';g.lineWidth=3;for(let q=0;q<4;q++){g.beginPath();g.moveTo(29+q*4,-19+q*7);g.lineTo(35+q*5,-13+q*7);g.stroke()}
 g.strokeStyle=b.color;g.lineWidth=9;g.beginPath();g.moveTo(frontX-18,-1);g.lineTo(frontX-5,frontY-11);g.stroke();

 // rear linkage + visible shock spring
 g.strokeStyle='#777';g.lineWidth=4;g.beginPath();g.moveTo(-10,10);g.lineTo(-31,18);g.lineTo(-21,-12);g.stroke();
 g.strokeStyle='#f1d33f';g.lineWidth=4;g.beginPath();for(let i=0;i<8;i++){let yy=-18+i*(4+sr*.04);g.lineTo(-17+(i%2?5:-5),yy)}g.stroke();

 // Engine architecture changes by displacement.
 let ew=cc<=85?27:cc<=125?32:cc<=250?38:cc<=450?44:47;
 let eh=cc<=85?25:cc<=125?30:cc<=250?35:cc<=450?40:42;
 g.fillStyle='#4f555a';g.roundRect(-ew/2,-8,ew,eh,5);g.fill();
 g.fillStyle='#92999e';g.roundRect(-ew*.30,-17,ew*.60,17,3);g.fill();
 g.strokeStyle='#292c2f';g.lineWidth=2;
 for(let yy=-15;yy<-1;yy+=4){g.beginPath();g.moveTo(-ew*.34,yy);g.lineTo(ew*.34,yy);g.stroke()}
 g.fillStyle='#aab0b4';g.beginPath();g.arc(-5,13,Math.max(8,ew*.27),0,Math.PI*2);g.fill();
 g.strokeStyle='#555';g.stroke();

 // Exhaust: small-bore 2T expansion chambers; 250+ progressively larger headers/mufflers.
 if(cc===60||cc===85||cc===125||cc===500){
   g.strokeStyle='#7c7770';g.lineWidth=7;g.beginPath();g.moveTo(8,-9);g.quadraticCurveTo(35,-3,28,14);g.quadraticCurveTo(15,28,-27,17);g.stroke();
   g.fillStyle='#676767';g.roundRect(rearX-7,-1,34,9,5);g.fill();
 }else{
   g.strokeStyle='#8a837b';g.lineWidth=5;g.beginPath();g.moveTo(9,-9);g.quadraticCurveTo(28,5,15,20);g.lineTo(rearX+18,8);g.stroke();
   g.fillStyle='#606367';g.roundRect(rearX+2,-3,38+(cc>=450?9:0),10,5);g.fill();
 }

 // Unique plastics/body silhouette for every CC.
 g.fillStyle=b.color;
 if(cc===60){
   g.beginPath();g.ellipse(-4,-29,22,11,-.1,0,Math.PI*2);g.fill();
   g.fillStyle='#171717';g.roundRect(-39,-39,37,7,3);g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-35,-34);g.lineTo(-68,-32);g.lineTo(-71,-27);g.lineTo(-37,-26);g.closePath();g.fill();
   g.beginPath();g.moveTo(20,-24);g.lineTo(frontX+17,-22);g.lineTo(frontX+22,-17);g.lineTo(26,-17);g.closePath();g.fill();
 }else if(cc===85){
   g.beginPath();g.moveTo(-27,-31);g.lineTo(13,-37);g.lineTo(29,-25);g.lineTo(9,-14);g.lineTo(-30,-17);g.closePath();g.fill();
   g.fillStyle='#171717';g.beginPath();g.moveTo(-47,-40);g.lineTo(2,-41);g.lineTo(9,-34);g.lineTo(-46,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-42,-35);g.lineTo(-77,-36);g.lineTo(-82,-30);g.lineTo(-44,-27);g.closePath();g.fill();
   g.beginPath();g.moveTo(25,-25);g.lineTo(frontX+20,-24);g.lineTo(frontX+27,-18);g.lineTo(31,-18);g.closePath();g.fill();
 }else if(cc===110){
   g.beginPath();g.moveTo(-31,-32);g.lineTo(15,-39);g.lineTo(34,-25);g.lineTo(14,-13);g.lineTo(-34,-16);g.closePath();g.fill();
   g.fillStyle='#171717';g.roundRect(-53,-42,58,8,3);g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-48,-36);g.lineTo(-87,-37);g.lineTo(-91,-30);g.lineTo(-50,-27);g.closePath();g.fill();
   g.beginPath();g.moveTo(27,-26);g.lineTo(frontX+22,-25);g.lineTo(frontX+29,-18);g.lineTo(34,-18);g.closePath();g.fill();
 }else if(cc===125){
   g.beginPath();g.moveTo(-33,-33);g.lineTo(17,-41);g.lineTo(40,-27);g.lineTo(22,-10);g.lineTo(-36,-15);g.closePath();g.fill();
   g.beginPath();g.moveTo(7,-30);g.lineTo(43,-22);g.lineTo(23,-8);g.closePath();g.fill();
   g.fillStyle='#111';g.beginPath();g.moveTo(-57,-43);g.lineTo(7,-44);g.lineTo(14,-35);g.lineTo(-55,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-50,-37);g.lineTo(-95,-41);g.lineTo(-98,-34);g.lineTo(-52,-27);g.closePath();g.fill();
   g.beginPath();g.moveTo(29,-27);g.lineTo(frontX+26,-27);g.lineTo(frontX+34,-20);g.lineTo(36,-18);g.closePath();g.fill();
 }else if(cc===150){
   g.beginPath();g.moveTo(-35,-34);g.lineTo(19,-42);g.lineTo(43,-27);g.lineTo(24,-9);g.lineTo(-38,-14);g.closePath();g.fill();
   g.fillStyle='#111';g.beginPath();g.moveTo(-59,-44);g.lineTo(8,-45);g.lineTo(16,-36);g.lineTo(-57,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-53,-38);g.lineTo(-98,-40);g.lineTo(-102,-33);g.lineTo(-55,-28);g.closePath();g.fill();
   g.beginPath();g.moveTo(30,-28);g.lineTo(frontX+28,-27);g.lineTo(frontX+35,-20);g.lineTo(38,-18);g.closePath();g.fill();
 }else if(cc===250){
   g.beginPath();g.moveTo(-39,-36);g.lineTo(21,-45);g.lineTo(48,-29);g.lineTo(29,-7);g.lineTo(5,-13);g.lineTo(-42,-14);g.closePath();g.fill();
   g.beginPath();g.moveTo(1,-30);g.lineTo(49,-23);g.lineTo(27,-4);g.lineTo(7,-12);g.closePath();g.fill();
   g.fillStyle='#111';g.beginPath();g.moveTo(-64,-46);g.lineTo(11,-47);g.lineTo(19,-37);g.lineTo(-61,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-57,-40);g.lineTo(-105,-44);g.lineTo(-109,-36);g.lineTo(-59,-28);g.closePath();g.fill();
   g.beginPath();g.moveTo(31,-29);g.lineTo(frontX+31,-29);g.lineTo(frontX+39,-21);g.lineTo(40,-18);g.closePath();g.fill();
 }else if(cc===450){
   g.beginPath();g.moveTo(-43,-38);g.lineTo(23,-48);g.lineTo(52,-31);g.lineTo(34,-5);g.lineTo(4,-11);g.lineTo(-46,-13);g.closePath();g.fill();
   g.beginPath();g.moveTo(-3,-32);g.lineTo(55,-25);g.lineTo(32,2);g.lineTo(2,-8);g.closePath();g.fill();
   g.fillStyle='#111';g.beginPath();g.moveTo(-69,-49);g.lineTo(14,-50);g.lineTo(22,-39);g.lineTo(-66,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-61,-42);g.lineTo(-113,-45);g.lineTo(-118,-36);g.lineTo(-63,-29);g.closePath();g.fill();
   g.beginPath();g.moveTo(33,-30);g.lineTo(frontX+35,-30);g.lineTo(frontX+44,-22);g.lineTo(42,-18);g.closePath();g.fill();
 }else{
   g.beginPath();g.moveTo(-46,-39);g.lineTo(25,-50);g.lineTo(57,-31);g.lineTo(37,-3);g.lineTo(5,-10);g.lineTo(-49,-13);g.closePath();g.fill();
   g.beginPath();g.moveTo(-4,-33);g.lineTo(59,-25);g.lineTo(35,4);g.lineTo(1,-7);g.closePath();g.fill();
   g.fillStyle='#111';g.beginPath();g.moveTo(-73,-51);g.lineTo(16,-52);g.lineTo(24,-40);g.lineTo(-70,-31);g.closePath();g.fill();
   g.fillStyle=b.color;g.beginPath();g.moveTo(-65,-43);g.lineTo(-121,-48);g.lineTo(-126,-38);g.lineTo(-67,-29);g.closePath();g.fill();
   g.beginPath();g.moveTo(34,-31);g.lineTo(frontX+39,-31);g.lineTo(frontX+49,-22);g.lineTo(44,-18);g.closePath();g.fill();
 }

 // white front number plate, bars and grips
 g.fillStyle='#f4f4f4';g.beginPath();g.moveTo(18,-50);g.lineTo(39,-46);g.lineTo(36,-22);g.lineTo(17,-25);g.closePath();g.fill();
 g.fillStyle='#222';g.font='bold 9px system-ui';g.fillText(String(cc),22,-32);
 g.strokeStyle='#333';g.lineWidth=4;g.beginPath();g.moveTo(27,-47);g.lineTo(45,-53);g.moveTo(27,-47);g.lineTo(12,-54);g.stroke();

 // rider stays connected to the chassis
 g.fillStyle='#20242a';g.beginPath();g.arc(-8,-66,11,0,Math.PI*2);g.fill();
 g.strokeStyle='#20242a';g.lineWidth=10;g.beginPath();g.moveTo(-8,-55);g.lineTo(10,-39);g.lineTo(35,-46);g.stroke();
 g.beginPath();g.moveTo(-10,-50);g.lineTo(-34,-29);g.lineTo(-19,1);g.stroke();

 g.restore();
}

function makeRagdoll(v){
 // One connected skeleton: head, shoulders, hips, elbows, hands, knees, feet.
 let pts=[
  {x:0,y:-63,px:0,py:-63,r:8},   // 0 head
  {x:0,y:-47,px:0,py:-47,r:4},   // 1 neck/chest
  {x:-10,y:-43,px:-10,py:-43,r:4},{x:10,y:-43,px:10,py:-43,r:4}, // shoulders
  {x:-18,y:-30,px:-18,py:-30,r:3},{x:24,y:-33,px:24,py:-33,r:3}, // elbows
  {x:-24,y:-17,px:-24,py:-17,r:3},{x:36,y:-39,px:36,py:-39,r:3}, // hands
  {x:-7,y:-20,px:-7,py:-20,r:4},{x:7,y:-20,px:7,py:-20,r:4},     // hips
  {x:-15,y:0,px:-15,py:0,r:4},{x:18,y:1,px:18,py:1,r:4},         // knees
  {x:-20,y:18,px:-20,py:18,r:4},{x:25,y:18,px:25,py:18,r:4}      // feet
 ];
 let vx=Math.min(16,3+v*.09),vy=-5-Math.min(8,v*.045);
 for(let p of pts){p.px=p.x-vx;p.py=p.y-vy}
 return {pts,links:[[0,1],[1,2],[1,3],[2,4],[4,6],[3,5],[5,7],[1,8],[1,9],[8,10],[10,12],[9,11],[11,13],[8,9]],x:0,y:0};
}
function solveDoll(d,dt,groundY){
 let grav=720*dt*dt;
 for(let p of d.pts){
  let vx=(p.x-p.px)*.992,vy=(p.y-p.py)*.992;
  p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+grav;
 }
 for(let pass=0;pass<5;pass++){
  for(let L of d.links){
   let a=d.pts[L[0]],b=d.pts[L[1]];
   let rest=[16,12,12,16,15,16,15,29,29,22,19,23,19,14][d.links.indexOf(L)]||18;
   let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,dif=(dist-rest)/dist*.5;
   a.x+=dx*dif;a.y+=dy*dif;b.x-=dx*dif;b.y-=dy*dif;
  }
  for(let p of d.pts){
   if(p.y>groundY){p.y=groundY;let vx=p.x-p.px;p.px=p.x-vx*.70;p.py=p.y+(p.y-p.py)*.18}
  }
 }
}
function drawDoll(d,ox,oy){
 let P=d.pts;
 g.save();g.translate(ox,oy);
 g.strokeStyle='#20242a';g.lineWidth=8;g.lineCap='round';
 for(let L of d.links){if(L[0]===0)continue;g.beginPath();g.moveTo(P[L[0]].x,P[L[0]].y);g.lineTo(P[L[1]].x,P[L[1]].y);g.stroke()}
 g.fillStyle='#20242a';g.beginPath();g.arc(P[0].x,P[0].y,10,0,Math.PI*2);g.fill();
 g.fillStyle='#e8e8e8';g.beginPath();g.arc(P[0].x+4,P[0].y-2,5,0,Math.PI*2);g.fill();
 g.restore();
}
function frame(now){
 // selectedIndex/value is source of truth every frame
 syncSelection();
 let dt=Math.min(.035,(now-last)/1000);last=now,b=bike(),p=(+gas.value||0)/100;
 if(running&&gear>0&&p>0){
   let caps=[0,.26,.43,.60,.75,.89,1],target=b.max*caps[gear]*(.12+.88*p);
   let response=b.cc<=85?2.6:b.cc<=150?3:b.cc<=250?3.5:4;
   speed+=Math.max(8,(target-speed)*response)*dt;
   if(speed>target)speed+=(target-speed)*3*dt;
 }else speed=Math.max(0,speed-8*dt);
 let accelInput=(running&&gear>0)?p:0;
 let targetF=(brakeHeld&&speed>1)?7.5:-accelInput*1.2;
 let targetR=accelInput*5.8-(brakeHeld&&speed>1?1.8:0);
 let k=38,c=12;
 suspFV+=(targetF-suspF)*k*dt-suspFV*c*dt;
 suspRV+=(targetR-suspR)*k*dt-suspRV*c*dt;
 suspF=Math.max(-7,Math.min(9,suspF+suspFV*dt));
 suspR=Math.max(-7,Math.min(9,suspR+suspRV*dt));
 let targetPitch=Math.max(-.12,Math.min(.12,(suspR-suspF)*.012));
 chassisPitch+=(targetPitch-chassisPitch)*Math.min(1,dt*7);
 if(brakeHeld&&speed>0)speed=Math.max(0,speed-(34+speed*.16)*dt);

 // RECOVERY V3 WHEELIE PHYSICS — isolated from the working drivetrain.
 // Power can lift the front only while the engine is running, in gear, moving, and on throttle.
 if(!crashed){
   let cc=b.cc;
   let power=cc<=85?.68:cc<=125?.78:cc<=150?.86:cc<=250?1.0:cc<=450?1.13:1.20;
   let speedFactor=Math.max(0,1-Math.max(0,speed-58)/90);
   let lift=(running&&gear>0&&speed>3)?Math.max(0,p-.30)*power*1.72*speedFactor:0;
   // Gravity/restoring force grows as the nose rises. Releasing gas always lets it fall.
   let gravity=.42+wheelieAngle*.92;
   // Rear brake / brake button aggressively brings the front down.
   let brakeDrop=brakeHeld?1.35:0;
   // First gear has more lift; taller gears progressively less.
   let gearLift=gear===1?1.18:gear===2?1.0:gear===3?.82:.62;
   wheelieVel+=(lift*gearLift-gravity-brakeDrop)*dt;
   wheelieVel*=Math.pow(.965,dt*60);
   wheelieAngle+=wheelieVel*dt;
   if(wheelieAngle<0){wheelieAngle=0;if(wheelieVel<0)wheelieVel=0}
   // About 69 degrees = loop-out threshold.
   if(wheelieAngle>1.20){
     crashed=true;running=false;wheelieAngle=1.28;wheelieVel=0;
     crashSpeed=speed;crashTime=0;
     bikeCrashX=0;bikeCrashY=0;bikeCrashRot=-wheelieAngle;
     bikeCrashVX=Math.min(520,120+speed*3.1);bikeCrashVY=-145-Math.min(130,speed*1.3);bikeCrashVR=-2.6-Math.min(3.5,speed*.025);
     doll=makeRagdoll(speed);
     speed*=.45;stopSound();
   }
 }else{
   speed=Math.max(0,speed-26*dt);
 }

 scroll+=speed*dt*18;sound();update();
 let w=innerWidth,h=innerHeight*.58;
 g.clearRect(0,0,w,h);g.fillStyle='#7bc5ff';g.fillRect(0,0,w,h*.68);g.fillStyle='#3e444b';g.fillRect(0,h*.68,w,h*.32);
 g.strokeStyle='#fff';g.lineWidth=4;g.setLineDash([40,35]);g.beginPath();g.moveTo(-(scroll%75),h*.83);g.lineTo(w,h*.83);g.stroke();g.setLineDash([]);
 if(!crashed){
   drawBike(b,w*.43,h*.68-42,suspF,suspR,chassisPitch-wheelieAngle);
 }else{
   crashTime+=dt;
   bikeCrashVY+=520*dt;bikeCrashX+=bikeCrashVX*dt;bikeCrashY+=bikeCrashVY*dt;bikeCrashRot+=bikeCrashVR*dt;
   let bikeGround=h*.68-17;
   if(h*.68-42+bikeCrashY>bikeGround){bikeCrashY=bikeGround-(h*.68-42);bikeCrashVY*=-.22;bikeCrashVX*=.965;bikeCrashVR*=.92}
   g.save();g.translate(bikeCrashX,bikeCrashY);drawBike(b,w*.43,h*.68-42,0,0,bikeCrashRot);g.restore();
   if(doll){solveDoll(doll,dt,23);drawDoll(doll,w*.43+crashTime*Math.min(260,70+crashSpeed*1.35),h*.68-42)}
   g.fillStyle='#ff3b30';g.font='900 30px system-ui';g.textAlign='center';g.fillText('💥 RIDER DOWN!',w*.5,55);
   g.font='700 14px system-ui';g.fillText('Tap START to reset',w*.5,80);g.textAlign='start';
 }
 requestAnimationFrame(frame)
}
update();requestAnimationFrame(frame);
</script></body></html>
